# fonts
font-family=Inconsolata
font-size=20
font-variation=wght=500

# splits
split-divider-color = #585858
keybind = cmd+a=new_split:down
keybind = cmd+d=new_split:right
keybind = cmd+w=close_surface
keybind = cmd+left=goto_split:left
keybind = cmd+right=goto_split:right
keybind = cmd+up=goto_split:up
keybind = cmd+down=goto_split:down
keybind = cmd+h=goto_split:left
keybind = cmd+l=goto_split:right
keybind = cmd+k=goto_split:up
keybind = cmd+j=goto_split:down

# base16-default-dark
background = 181818
foreground = d8d8d8
selection-background = 383838
selection-foreground = 181818
palette = 0=#181818
palette = 1=#ab4642
palette = 2=#a1b56c
palette = 3=#f7ca88
palette = 4=#7cafc2
palette = 5=#ba8baf
palette = 6=#86c1b9
palette = 7=#d8d8d8
palette = 8=#585858
palette = 9=#ab4642
palette = 10=#a1b56c
palette = 11=#f7ca88
palette = 12=#7cafc2
palette = 13=#ba8baf
palette = 14=#86c1b9
palette = 15=#f8f8f8
palette = 16=#dc9656
palette = 17=#a16946
palette = 18=#282828
palette = 19=#383838
palette = 20=#b8b8b8
palette = 21=#e8e8e8

# https://ghostty.org/docs/help/terminfo#ssh
shell-integration-features = ssh-env
